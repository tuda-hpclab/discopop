[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discopop_mcp_server"
dynamic = ["version"]
description = "MCP Server for DiscoPoP - Enables Claude to interact with DiscoPoP profiling and analysis tools"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
authors = [
    {name = "TU Darmstadt and Iowa State University", email = "discopop@lists.parallel.informatik.tu-darmstadt.de"}
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    # mcp 2.x replaced the low-level Server decorator API (@server.list_tools() /
    # @server.call_tool()) with constructor-based handlers; server.py still uses the 1.x API.
    "mcp>=1.0,<2",
    "termcolor>=2.0",
    "uvicorn>=0.20",
    "starlette>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "mypy",
    "black",
]

[project.scripts]
discopop_mcp_server = "mcp_server.server:main"

[project.urls]
Homepage = "https://www.discopop.tu-darmstadt.de/"
Repository = "https://github.com/tuda-hpclab/discopop"
Documentation = "https://www.discopop.tu-darmstadt.de/"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = [".."]
include = ["mcp_server*"]
# Namespace discovery would otherwise also pick up the build output inside this
# directory (mcp_server.build.lib.mcp_server...), nesting it one level deeper per build.
exclude = ["mcp_server.build*", "mcp_server.dist*"]

[tool.setuptools]
zip-safe = true
# Package data is not needed; with it on, a stale egg-info SOURCES.txt listing
# build/lib/... files would bring the build output back in as package data.
include-package-data = false
