# this file specifies common mypy options for the DiscoPoP project
# call mypy with `--config-file=mypy.ini`
# check https://mypy.readthedocs.io/en/stable/config_file.html for more details

[mypy]
# treat explorer/, library/, GUI/ and hotspot_detection/ as source roots so packages resolve to a
# single module path each. hotspot_detection is a path entry only, not in `files`: the GUI imports
# discopop_hotspot_analyzer.region_keys, so the import has to resolve to the source rather than to
# whatever happens to be installed, but the rest of that package is not type checked here.
mypy_path = explorer,library,GUI,hotspot_detection

# prevent explorer/ and library/ (no __init__.py) from being treated as namespace packages
# from CWD, which would otherwise create duplicate module paths like explorer.discopop_explorer.*
namespace_packages = False

# point directly at the package directories so mypy's root detection resolves them as
# discopop_explorer.*, discopop_library.*, and discopop_gui.* rather than explorer.discopop_explorer.*
files = library/discopop_library,explorer/discopop_explorer,GUI/discopop_gui

# select files to ignore
exclude = library/discopop_library/ConfigProvider/assets/build_config.py|/build/|library/discopop_library/discopop_optimizer/Microbench

# helps to catch typos in this file
warn_unused_configs = True

# increase strictness of type checking above default
warn_redundant_casts = True
warn_return_any = True
disallow_subclassing_any = True
disallow_untyped_decorators = True
no_implicit_reexport = True
no_implicit_optional = True
strict_equality = True
disallow_any_generics = True
check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_defs = True

# the following options should be enabled one by one, then we will switch to `strict` type checking:
#disallow_untyped_calls = True
#warn_unused_ignores = True
#extra-checks (command line flag of mypy... is there a way to set it in the config file?)
#strict = True

# while we transition to --strict, we will allow project-specific settings, later everything should be checked using `strict`
[mypy-networkx.*]
ignore_missing_imports = True

[mypy-discopop_explorer.*]

[mypy-discopop_library.*]
