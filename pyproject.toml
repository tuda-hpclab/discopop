[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discopop"
dynamic = ["version"]
description = "DiscoPoP is a tool that helps software developers parallelize their programs with threads. It discovers potential parallelism in a sequential program and makes recommendations on how to exploit it."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
    {name = "TU Darmstadt and Iowa State University", email = "discopop@lists.parallel.informatik.tu-darmstadt.de"},
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
"Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "discopop-profiler>=0.0.1a2",
    "discopop-library>=0.0.1a4",
    "discopop-gui>=0.0.1a2",
    "discopop-explorer>=0.0.1a2",
    "discopop-mcp-server>=0.0.1a1",
    "discopop-hotspot-detection>=0.0.1a1",
    "mypy", "black", "data-science-types"
]

[project.urls]
Homepage = "https://www.discopop.tu-darmstadt.de/"

[tool.black]
line-length = 120
target-version = ["py311"]  # oldest supported Python (requires-python), so black never emits newer syntax

[tool.pytest.ini_options]
# unit tests and end-to-end tests (marker e2e; skipped without the installed profiler, see CLAUDE.md)
testpaths = [
    "explorer/discopop_explorer",
    "library/discopop_library",
    "mcp_server",
    "hotspot_detection",
    "test/project_manager",
    "test/end_to_end",
    "test/leak_check",
    "benchmark/compare",
]
# the work-in-progress end-to-end tests (test/wip_end_to_end, opt-in) are named test.py
python_files = ["test_*.py", "*_test.py", "test.py"]
markers = ["e2e: end-to-end test below test/end_to_end (set by its conftest.py)"]
# importlib: the default prepend mode resolves colocated test modules to their installed copies in
# site-packages once several package roots are collected together, and aborts with an import file mismatch
addopts = "--import-mode=importlib"
# import the packages under test from the source tree, also where they are not installed in editable mode
pythonpath = [".", "explorer", "library", "hotspot_detection", "benchmark/compare"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
packages = []
zip-safe = true
