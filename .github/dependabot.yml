# version updates for the pinned development tools in requirements-dev.txt only. a new mypy or black
# release can report new findings; receiving it as a separate pull request keeps those findings out of
# unrelated changes. security updates of all other dependencies are unaffected by this file.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "black"
      - dependency-name: "data-science-types"
      - dependency-name: "mypy"
      - dependency-name: "pytest"
    groups:
      dev-tools:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
