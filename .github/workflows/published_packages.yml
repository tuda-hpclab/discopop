name: "Published packages"

# Installs the newest stable release and the newest pre-release of DiscoPoP from PyPI the way the installation guide
# describes (Ubuntu 24.04, the documented apt packages, a venv) and runs the example end to end
# (scripts/dev/check_published_installation.py). It shows whether the published versions of the packages work
# together; the result does not depend on the code of a commit, so it is no part of the CI of pull requests (a broken
# release would fail every one of them). It runs:
# - after every publish workflow (a release of one package can break the combination with the others),
# - on pull requests changing the check itself, and on request (workflow_dispatch).
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Publish DiscoPoP Package"
      - "Publish DiscoPoP Package (Pre-release)"
      - "Publish discopop-profiler to PyPI"
      - "Publish discopop-library to PyPI"
      - "Publish discopop-explorer to PyPI"
      - "Publish discopop-gui to PyPI"
      - "Publish discopop-hotspot-detection to PyPI"
      - "Publish discopop-mcp-server to PyPI"
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/published_packages.yml"
      - "scripts/dev/check_published_installation.py"
      - "example/**"

permissions:
  contents: read

concurrency:
  group: published-packages-${{ github.event_name == 'pull_request' && github.ref || 'releases' }}
  cancel-in-progress: true

jobs:
  published_installation:
    # a GitHub-hosted runner: a clean system as a user has it, and no wait for the self-hosted runners
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: "Newest ${{ matrix.channel }} from PyPI: install and run the example"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, pre-release]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # the command of the installation guide (docs/setup/discopop.md, "Debian and Ubuntu")
      - name: Install the system packages of the installation guide
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv python3-tk build-essential cmake git llvm-19-dev clang-19 clang-tools-19 libclang-19-dev libomp-19-dev libboost-dev

      # PyPI's index can lag behind the upload of a publish workflow for a short time
      - name: Wait for the index after a release
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 120

      - name: Install the newest ${{ matrix.channel }} and run the example
        run: |
          python3 scripts/dev/check_published_installation.py --channel ${{ matrix.channel }} --work-dir "$RUNNER_TEMP/published"
