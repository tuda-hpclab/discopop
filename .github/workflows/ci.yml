name: "DiscoPoP CI"

# which configurations run is decided in create_matrix: the full matrix when merging into master or new_explorer
# (pushes to them, pull requests targeting them), debian trixie with LLVM 21 for every other push.
# pull requests into other branches need no run of their own: the push to their branch is tested already.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - new_explorer  # This is a temporary addition and should be removed before merging into master!
  # manual runs, e.g. to get the callback benchmark (callback_benchmark) for a branch
  workflow_dispatch:

# the jobs only read the repository
permissions:
  contents: read

# a new push to a pull request or a branch supersedes the running checks of the previous push; the limited
# self-hosted capacity is spent on the current state. pushes to master and new_explorer are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/new_explorer') }}

jobs:
# used for eventual multiple operating system testing
# the full matrix runs when merging into master or new_explorer; other pushes only test debian trixie with LLVM 21
# ("reduced"). The jobs outside the matrix run in both cases.
# the entries cover each supported LLVM version (19-22) and the minimum Python (3.10) once, see CLAUDE.md.
# LLVM 21 is packaged by neither distribution (apt.llvm.org), Python 3.10 comes from the deadsnakes PPA.
# "python" is the interpreter the venv is created with.
#
# PREREQUISITE IMAGES: installing the prerequisites (apt) in every job took longer than some of the jobs. Instead,
# prepare_images builds one image per environment (base image + install_deps_cmd), once, and pushes it to the
# GitHub container registry; the other jobs run in these images and only check out the repository. The tag of an image
# is derived from its base image and install command, so changing either one builds a new image, and a push that
# changes neither one reuses the existing image. Bump IMAGE_REVISION to rebuild all images, e.g. to update the packages.
  create_matrix:
    runs-on: self-hosted
    name: Create matrix
    # the jobs run on a self-hosted runner: never execute code from pull requests of forks there.
    # a maintainer pushes such a branch to this repository to have it checked.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.create_matrix.outputs.scope }}
      matrix: ${{ steps.create_matrix.outputs.matrix }}
      images: ${{ steps.create_matrix.outputs.images }}
      build_environments: ${{ steps.create_matrix.outputs.build_environments }}
      tools_image: ${{ steps.create_matrix.outputs.tools_image }}
      primary_image: ${{ steps.create_matrix.outputs.primary_image }}
      leak_check_image: ${{ steps.create_matrix.outputs.leak_check_image }}
    steps:
      - name: Create build matrix
        id: create_matrix
        shell: bash
        run: |
          IMAGE_REVISION=1
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/discopop-ci"

          # entry <id> <base image> <python> <install command>: one environment, as a JSON object
          entry() {
            local tag
            tag="$1-$(printf '%s\n%s\n%s\n' "$IMAGE_REVISION" "$2" "$4" | sha256sum | cut -c1-12)"
            printf '{"id":"%s","base_image":"%s","python":"%s","install_deps_cmd":"%s","image":"%s"}' \
              "$1" "$2" "$3" "$4" "$repository:$tag"
          }
          image_of() { sed -E 's/.*"image":"([^"]*)".*/\1/' <<< "$1"; }

          apt_common="export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev"

          e_llvm19="$(entry ubuntu-24-04-llvm-19-python-3.10 ubuntu:24.04 python3.10 "$apt_common && apt install -y software-properties-common && add-apt-repository -y ppa:deadsnakes/ppa && apt install -y python3.10 python3.10-venv python3.10-tk python3.10-dev && apt install -y llvm-19-dev clang-19 libomp-19-dev")"
          e_llvm20="$(entry ubuntu-24-04-llvm-20 ubuntu:24.04 python3 "$apt_common && apt install -y llvm-20-dev clang-20 libomp-20-dev")"
          e_llvm21="$(entry debian-trixie-llvm-21 debian:trixie python3 "$apt_common && apt install -y wget lsb-release gnupg && wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && bash /tmp/llvm.sh 21 && apt install -y llvm-21-dev clang-21 libomp-21-dev")"
          e_llvm22="$(entry debian-trixie-llvm-22 debian:trixie python3 "$apt_common && apt install -y llvm-22-dev clang-22 libomp-22-dev")"
          # the sanitized unit tests and the coverage (no venv needed); llvm-19 provides llvm-cov and llvm-profdata
          e_tools="$(entry ubuntu-24-04-llvm-19-tools ubuntu:24.04 python3 "$apt_common && apt install -y llvm-19 llvm-19-dev clang-19 libomp-19-dev")"
          # the leak check links against the sanitizer runtime of clang
          e_leak="$(entry debian-trixie-llvm-19-leak-check debian:trixie python3 "export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 build-essential make cmake git llvm-19-dev clang-19 libclang-rt-19-dev libomp-19-dev libboost-all-dev")"

          # the full matrix only where code is merged into master or new_explorer (pushes and pull requests
          # targeting them); every other push is checked on one platform to keep development runs short
          if [[ ( "$GITHUB_EVENT_NAME" = "push" && ( "$GITHUB_REF" = "refs/heads/master" || "$GITHUB_REF" = "refs/heads/new_explorer" ) ) \
             || ( "$GITHUB_EVENT_NAME" = "pull_request" && ( "$GITHUB_BASE_REF" = "master" || "$GITHUB_BASE_REF" = "new_explorer" ) ) ]]; then
            matrix="{\"include\":[$e_llvm19,$e_llvm20,$e_llvm21,$e_llvm22]}"
            images="[$e_llvm19,$e_llvm20,$e_llvm21,$e_llvm22,$e_tools,$e_leak]"
            # the environments that need the venv with DiscoPoP (see prepare_build)
            build_environments="[$e_llvm19,$e_llvm20,$e_llvm21,$e_llvm22]"
            scope="full"
          else
            matrix="{\"include\":[$e_llvm21]}"
            images="[$e_llvm21,$e_tools,$e_leak]"
            build_environments="[$e_llvm21]"
            scope="reduced"
          fi
          echo "Configuration: $scope"

          {
            echo "scope=$scope"
            echo "matrix<<END"
            echo "$matrix"
            echo "END"
            echo "images<<END"
            echo "$images"
            echo "END"
            echo "build_environments<<END"
            echo "$build_environments"
            echo "END"
            echo "tools_image=$(image_of "$e_tools")"
            # the environment of the jobs outside the matrix that need the venv (static checks, benchmarks): the matrix entry
            # both configurations contain, so its venv is prepared anyway
            echo "primary_image=$(image_of "$e_llvm21")"
            echo "leak_check_image=$(image_of "$e_leak")"
          } >> "$GITHUB_OUTPUT"

  # builds the prerequisite images that do not exist in the registry yet (see create_matrix)
  prepare_images:
    runs-on: self-hosted
    name: "Prepare image: ${{ matrix.id }}"
    needs: [create_matrix]
    timeout-minutes: 60
    # the only job that writes to the registry; the others only read
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.create_matrix.outputs.images) }}
    steps:
      - name: Build and push the image, unless it exists
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          BASE_IMAGE: ${{ matrix.base_image }}
          INSTALL_CMD: ${{ matrix.install_deps_cmd }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # local runs with act (scripts/dev/run_ci_locally.sh): no registry, the image stays in the local docker
          if [ -z "${ACT:-}" ]; then
            echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "$IMAGE exists"
              exit 0
            fi
          elif docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE exists"
            exit 0
          fi
          docker build --pull --network=host -t "$IMAGE" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "INSTALL_CMD=$INSTALL_CMD" - <<'EOF'
          ARG BASE_IMAGE=ubuntu:24.04
          FROM ${BASE_IMAGE}
          ARG INSTALL_CMD
          RUN bash -c "$INSTALL_CMD" && rm -rf /var/lib/apt/lists/*
          EOF
          if [ -z "${ACT:-}" ]; then
            docker push "$IMAGE"
          fi


  # BUILT CODE: builds the venv with all DiscoPoP packages (installed without -e) once per environment and saves it to
  # the actions cache (see .github/actions/prepared-venv); the jobs below restore it instead of installing themselves.
  # The built profiler is cached separately and keyed by profiler/ only: a change of the Python sources reinstalls the
  # packages, but does not rebuild the profiler.
  prepare_build:
    runs-on: self-hosted
    name: "Prepare build: ${{ matrix.id }}"
    needs: [create_matrix, prepare_images]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.create_matrix.outputs.build_environments) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build the venv with DiscoPoP, unless it is cached
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ matrix.image }}
          python: ${{ matrix.python }}
          save: "true"

  # The tests of the matrix entries are split by kind into the jobs below, so a failure names what failed and the
  # kinds run in parallel. Each matrix job restores the prepared venv and installs the DiscoPoP packages itself.
  #
  # STATIC CHECKS: independent of the platform (black targets the supported Python versions, see pyproject.toml), so
  # they run once instead of per matrix entry.
  static_checks:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.create_matrix.outputs.primary_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Static checks: license tags, formatting (black)"
    needs: [create_matrix, prepare_images, prepare_build]
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check all files for the DiscoPoP license tag
        run: |
          ./scripts/dev/check-license.sh $(find . -type f)

      # only black (requirements-dev.txt) is needed from this venv
      - name: Setup venv
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ needs.create_matrix.outputs.primary_image }}

      - name: Check formatting of DiscoPoP Explorer
        run: |
          venv/bin/python3 -m black -l 120 --check explorer

      - name: Check formatting of DiscoPoP Library
        run: |
          venv/bin/python3 -m black -l 120 --check library

      - name: Check formatting of the leak check programs and evaluation
        run: |
          venv/bin/python3 -m black -l 120 --check test/leak_check

      - name: Check formatting of DiscoPoP Hotspot Detection
        run: |
          venv/bin/python3 -m black -l 120 --check hotspot_detection/discopop_hotspot_analyzer hotspot_detection/discopop_hotspot_cc hotspot_detection/discopop_hotspot_cxx

      - name: Check formatting of DiscoPoP GUI
        run: |
          venv/bin/python3 -m black -l 120 --check GUI

      - name: Check formatting of DiscoPoP MCP Server
        run: |
          venv/bin/python3 -m black -l 120 --check mcp_server

      - name: Check formatting of the benchmark drivers and the instrumentation tests
        run: |
          venv/bin/python3 -m black -l 120 --check benchmark/pass_overhead benchmark/injected_functions test/instrumentation

  # TYPE CHECK per matrix entry: mypy checks against the Python version of the interpreter it runs with
  type_check:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Type check: mypy (${{ matrix.id }})"
    needs: [create_matrix, prepare_images, prepare_build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # the venv with all DiscoPoP packages comes from the prepare_build job
      - name: Setup venv with DiscoPoP
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ matrix.image }}
          python: ${{ matrix.python }}

      - name: Run mypy
        run: |
          venv/bin/python3 -m mypy --config-file=mypy.ini

  # PYTHON UNIT TESTS: the roots and import mode are configured in pyproject.toml ([tool.pytest.ini_options])
  python_unit_tests:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Python unit tests (${{ matrix.id }})"
    needs: [create_matrix, prepare_images, prepare_build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # the venv with all DiscoPoP packages comes from the prepare_build job
      - name: Setup venv with DiscoPoP
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ matrix.image }}
          python: ${{ matrix.python }}

      - name: Run the Python unit tests
        run: |
          . venv/bin/activate
          python3 -m pytest

  # PROFILER UNIT TESTS: the GoogleTest binaries of the runtime library (DiscoPoP_UT) and the LLVM pass (DiscoPoP_Pass_UT);
  # built from the root CMakeLists.txt, they need no venv
  profiler_unit_tests:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Profiler unit tests: runtime library and LLVM pass (${{ matrix.id }})"
    needs: [create_matrix, prepare_images]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build the unit tests
        run: |
          cmake -S . -B build_tests -DCMAKE_BUILD_TYPE=Release -DDP_BUILD_UNITTESTS=1
          cmake --build build_tests --target DiscoPoP_UT DiscoPoP_Pass_UT -j "$(nproc)"

      - name: Run the runtime library unit tests (DiscoPoP_UT)
        run: |
          build_tests/test/unit_tests/DiscoPoP_UT

      - name: Run the LLVM pass unit tests (DiscoPoP_Pass_UT)
        run: |
          build_tests/test/pass_unit_tests/DiscoPoP_Pass_UT

  # PROFILER TESTS of programs compiled with discopop_cxx: which callbacks the pass inserts where (test/instrumentation),
  # and the data dependencies the profiling run finds (test/profiler, gold standard)
  profiler_tests:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Profiler tests: instrumentation, dependency detection (${{ matrix.id }})"
    needs: [create_matrix, prepare_images, prepare_build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # the venv with all DiscoPoP packages comes from the prepare_build job
      - name: Setup venv with DiscoPoP
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ matrix.image }}
          python: ${{ matrix.python }}

      - name: Instrumentation tests
        run: |
          . venv/bin/activate
          python3 -m unittest -v -k "*test.instrumentation.*"

      - name: Profiler gold standard tests
        run: |
          . venv/bin/activate
          python3 -m unittest -v -k "*test.profiler.*"

  # END-TO-END TESTS: the whole pipeline (profiling, pattern detection, patches, MCP server) on small programs
  end_to_end_tests:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "End-to-end tests (${{ matrix.id }})"
    needs: [create_matrix, prepare_images, prepare_build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # the venv with all DiscoPoP packages comes from the prepare_build job
      - name: Setup venv with DiscoPoP
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ matrix.image }}
          python: ${{ matrix.python }}

      - name: Python end-to-end tests
        run: |
          . venv/bin/activate
          python3 -m unittest -v -k "*.end_to_end.*"

  # SANITIZED UNIT TESTS of the profiler runtime library: the C++ unit tests (DiscoPoP_UT) run against a runtime
  # built with sanitizers (DP_SANITIZERS). Finds memory errors, undefined behavior and data races in the runtime's
  # code, but only in what the unit tests exercise: no LLVM pass and no instrumented program are involved.
  # The other memory check, "Leak check of instrumented programs", runs real instrumented programs instead.
  # Locally: scripts/dev/run_profiler_sanitizers.sh <address,undefined|thread>
  runtime_unit_tests_sanitized:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.create_matrix.outputs.tools_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
      # TSan needs ASLR disabled on kernels with high mmap entropy (setarch -R), which Docker's default seccomp profile forbids
      options: --security-opt seccomp=unconfined
    name: "Runtime unit tests with sanitizers (${{ matrix.label }})"
    # the more detailed checks only run once the basic checks and tests have passed
    needs: [create_matrix, prepare_images, static_checks, type_check, python_unit_tests, profiler_unit_tests, profiler_tests, end_to_end_tests]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizers: "address,undefined"
            label: "ASan+UBSan: memory errors, undefined behavior"
          - sanitizers: "thread"
            label: "TSan: data races"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # builds DiscoPoP_UT with -DDP_SANITIZERS and runs it with the *SAN_OPTIONS and suppressions (test/unit_tests/sanitizers)
      - name: Build the runtime unit tests with ${{ matrix.sanitizers }} and run them
        run: |
          scripts/dev/run_profiler_sanitizers.sh "${{ matrix.sanitizers }}"

  # LEAK CHECK OF INSTRUMENTED PROGRAMS: small programs (test/leak_check/programs) are compiled with the DiscoPoP
  # pass, linked against a runtime built with AddressSanitizer/LeakSanitizer and run. The runtime library must
  # not leak, and must not keep growing memory over the run time (see scripts/dev/check_profiler_leaks.sh and
  # test/leak_check/evaluate_leaks.py). It only looks for leaks, but in the whole pipeline and in more detail than
  # LSan's check at exit: before and after the runtime's shutdown, against a list of known bounded leaks, and
  # short against long runs. The sanitized unit tests are a separate job ("Runtime unit tests with sanitizers").
  # One platform is enough: the check is about the runtime library's code, not about the platform.
  # Locally: scripts/dev/check_profiler_leaks.sh, or scripts/dev/run_ci_locally.sh -j instrumented_programs_leak_check
  instrumented_programs_leak_check:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.create_matrix.outputs.leak_check_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Leak check of instrumented programs (ASan/LSan)"
    # the more detailed checks only run once the basic checks and tests have passed
    needs: [create_matrix, prepare_images, static_checks, type_check, python_unit_tests, profiler_unit_tests, profiler_tests, end_to_end_tests]
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build, run and evaluate the leak check programs
        run: |
          # the unit tests run under ASan/LSan in the "Runtime unit tests with sanitizers" job already
          DP_LEAK_CHECK_JOBS="$(nproc)" scripts/dev/check_profiler_leaks.sh --skip-unit-tests

  # Line coverage of the runtime library by DiscoPoP_UT (clang source based coverage, see
  # scripts/dev/run_rtlib_coverage.sh). Not part of checks_successful yet: the floor of 90% lines is
  # reported, not enforced, until it has proven stable on the runner.
  rtlib_coverage:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.create_matrix.outputs.tools_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Coverage: runtime library unit tests"
    # the more detailed checks only run once the basic checks and tests have passed
    needs: [create_matrix, prepare_images, static_checks, type_check, python_unit_tests, profiler_unit_tests, profiler_tests, end_to_end_tests]
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Measure the coverage of the runtime library
        run: |
          scripts/dev/run_rtlib_coverage.sh --markdown-out rtlib_coverage_summary.md --min-line-coverage 90

      - name: Add the report to the job summary
        if: ${{ always() }}
        run: |
          if [ -f rtlib_coverage_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat rtlib_coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Builds a set of small programs with and without the DiscoPoP pass and runs both
  # (benchmark/pass_overhead). Fails if a program does not build or run, or if the instrumented
  # binary does not reproduce the output of the uninstrumented one; the timings are reported, not
  # enforced.
  pass_overhead_benchmark:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.create_matrix.outputs.primary_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Benchmark: overhead of the DiscoPoP LLVM pass"
    needs: [create_matrix, prepare_images, prepare_build]
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # the profiler has to be installed without -e: otherwise LLVMDiscoPoP.so is not in the venv
      - name: Setup venv with DiscoPoP
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ needs.create_matrix.outputs.primary_image }}

      - name: Compare builds with and without the DiscoPoP pass
        run: |
          venv/bin/python3 benchmark/pass_overhead/run_pass_benchmark.py --json-out pass_overhead_results.json --markdown-out pass_overhead_summary.md

      - name: Add the comparison to the job summary
        if: ${{ always() }}
        run: |
          if [ -f pass_overhead_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat pass_overhead_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # What the injected callbacks cost (benchmark/injected_functions): per call, with and without their
  # bodies, and per program, attributed to the single callbacks (--callback-breakdown, builds the
  # runtime library variants). The times depend on the runner too much to gate on, and the breakdown
  # is expensive: only where code is merged (see below) and on manual runs, not part of checks_successful.
  callback_benchmark:
    runs-on: self-hosted
    # not on every push to a feature branch (it takes long), but where code is merged: pull requests into master or
    # new_explorer (never from forks, see create_matrix), pushes to them, and manual runs
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/new_explorer')) || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.create_matrix.outputs.primary_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Benchmark: cost of the injected callbacks"
    needs: [create_matrix, prepare_images, prepare_build]
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # installed without -e: the breakdown drives clang with the pass plugin from the venv
      - name: Setup venv with DiscoPoP
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ needs.create_matrix.outputs.primary_image }}

      # configures and builds build_tests itself
      - name: Measure the injected callbacks with and without their bodies
        run: |
          venv/bin/python3 benchmark/injected_functions/run_callback_benchmark.py --json-out callback_benchmark_results.json --markdown-out callback_benchmark_summary.md

      - name: Add the comparison to the job summary
        if: ${{ always() }}
        run: |
          if [ -f callback_benchmark_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat callback_benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the runtime library variants
        run: |
          cmake --build build_tests --target DiscoPoP_RT_BenchmarkVariants -j "$(nproc)"

      # one repetition per configuration: the question is which callbacks dominate, not by how many percent
      - name: Attribute the whole program overhead to the callbacks
        run: |
          venv/bin/python3 benchmark/pass_overhead/run_pass_benchmark.py --callback-breakdown --repetitions 1 --json-out callback_breakdown_results.json --markdown-out callback_breakdown_summary.md

      - name: Add the breakdown to the job summary
        if: ${{ always() }}
        run: |
          if [ -f callback_breakdown_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat callback_breakdown_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  checks_successful:
    runs-on: self-hosted
    name: Checks successful
    # a matrix job stands for all of its entries, i.e. the configurations create_matrix selected for
    # this run: debian trixie with LLVM 21 in the reduced, every entry in the full configuration
    needs: [create_matrix, static_checks, type_check, python_unit_tests, profiler_unit_tests, profiler_tests, end_to_end_tests, runtime_unit_tests_sanitized, instrumented_programs_leak_check, pass_overhead_benchmark]
    # require success explicitly: a skipped job (e.g. a pull request from a fork) must not report success
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" != "false" ]]; then
            echo "Checks did not succeed, job results: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "All checks successful (${{ needs.create_matrix.outputs.scope }} configuration: ${{ join(fromJson(needs.create_matrix.outputs.matrix || '{"include":[]}').include.*.id, ', ') }})"
