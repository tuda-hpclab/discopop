name: "DiscoPoP CI"

on:
  push:
    branches:
      - master
      - new_explorer  # This is a temporary addition and should be removed before merging into master!
  pull_request:
    branches:
      - "**"

# the jobs only read the repository
permissions:
  contents: read

# a new push to a pull request supersedes the running checks of the previous push; the limited
# self-hosted capacity is spent on the current state. pushes to master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_install_and_test:
    runs-on: self-hosted
    # the jobs run on a self-hosted runner: never execute code from pull requests of forks there.
    # a maintainer pushes such a branch to this repository to have it checked.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 180
    container:
      image: ${{ matrix.image }}
    name: "${{ matrix.os }} / LLVM ${{ matrix.llvm }} / Python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      # Every entry runs the full suite on the self-hosted runner, so instead of the full cross product the
      # matrix covers each supported version once:
      #   - LLVM: every major version the profiler accepts (19-22, see profiler/CMakeLists.txt)
      #   - Python: the minimum of requires-python (3.10) and the distribution Pythons (3.12, 3.13)
      #   - OS: the current Ubuntu LTS and Debian stable, pinned to their release so a new release cannot break CI
      # The oldest LLVM is paired with the oldest Python, and ubuntu 24.04 / LLVM 20 matches the publish workflows.
      # llvm_source / python_source: "distro" installs from the image's own repositories, otherwise from
      # apt.llvm.org (LLVM 21 is in neither distribution) or the deadsnakes PPA (Python 3.10 on ubuntu 24.04).
      matrix:
        include:
          - os: "ubuntu 24.04"
            image: "ubuntu:24.04"
            llvm: 19
            llvm_source: distro
            python: "3.10"
            python_source: deadsnakes
          - os: "ubuntu 24.04"
            image: "ubuntu:24.04"
            llvm: 20
            llvm_source: distro
            python: "3.12"
            python_source: distro
          - os: "debian 13"
            image: "debian:trixie"
            llvm: 21
            llvm_source: apt.llvm.org
            python: "3.13"
            python_source: distro
          - os: "debian 13"
            image: "debian:trixie"
            llvm: 22
            llvm_source: distro
            python: "3.13"
            python_source: distro

    steps:
      - name: Install Prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev
          if [ "${{ matrix.llvm_source }}" = "apt.llvm.org" ]; then
            # llvm.sh needs add-apt-repository only on Ubuntu; Debian 13 does not package it any more
            apt-get install -y wget lsb-release gnupg
            if [ "$(. /etc/os-release && echo "$ID")" = "ubuntu" ]; then apt-get install -y software-properties-common; fi
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            bash /tmp/llvm.sh ${{ matrix.llvm }}
          fi
          if [ "${{ matrix.python_source }}" = "deadsnakes" ]; then
            apt-get install -y software-properties-common
            add-apt-repository -y ppa:deadsnakes/ppa
            apt-get install -y python${{ matrix.python }} python${{ matrix.python }}-venv python${{ matrix.python }}-tk python${{ matrix.python }}-dev
          fi
          apt-get install -y llvm-${{ matrix.llvm }}-dev clang-${{ matrix.llvm }} libomp-${{ matrix.llvm }}-dev

      - name: Checkout Repository
        uses: actions/checkout@v4
#        with:
#          submodules: recursive

      - name: Check all files for DiscoPoP License tag
        run: |
          ./scripts/dev/check-license.sh $(find . -type f)

      - name: Setup venv and install DiscoPoP
        run: |
          rm -rf venv
          if [ "${{ matrix.python_source }}" = "deadsnakes" ]; then python=python${{ matrix.python }}; else python=python3; fi
          # fail if the distribution's Python no longer matches the version named in the job
          $python -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python }}', 'expected Python ${{ matrix.python }}, got ' + v"
          $python -m venv venv
          venv/bin/pip install -r requirements-dev.txt -e . ./profiler ./explorer ./library ./hotspot_detection ./GUI ./mcp_server

      - name: Run MyPy Type Checking
        run: |
            venv/bin/python3 -m mypy --config-file=mypy.ini

      - name: Check formatting of DiscoPoP Explorer
        run: |
            venv/bin/python3 -m black -l 120 --check explorer

      - name: Check formatting of DiscoPoP Library
        run: |
            venv/bin/python3 -m black -l 120 --check library

      - name: Check formatting of DiscoPoP Hotspot Detection
        run: |
            venv/bin/python3 -m black -l 120 --check hotspot_detection/discopop_hotspot_analyzer hotspot_detection/discopop_hotspot_cc hotspot_detection/discopop_hotspot_cxx

      - name: Check formatting of DiscoPoP GUI
        run: |
            venv/bin/python3 -m black -l 120 --check GUI

      - name: Check formatting of DiscoPoP MCP Server
        run: |
            venv/bin/python3 -m black -l 120 --check mcp_server

      # Python: the roots and import mode are configured in pyproject.toml ([tool.pytest.ini_options])
      - name: Unit test check
        run: |
          . venv/bin/activate
          python3 -m pytest
          cmake -S . -B build_tests -DCMAKE_BUILD_TYPE=Release -DDP_BUILD_UNITTESTS=1
          cmake --build build_tests --target DiscoPoP_UT -j "$(nproc)"
          build_tests/test/unit_tests/DiscoPoP_UT

      - name: Profiler gold standard tests
        run: |
            . venv/bin/activate
            python3 -m unittest -v -k "*test.profiler.*"

      - name: Python end-to-end-tests
        run: |
            . venv/bin/activate
            python3 -m unittest -v -k "*.end_to_end.*"


  # profiler runtime library + C++ unit tests built with sanitizers (DP_SANITIZERS); the LLVM pass is not sanitized
  sanitizers:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see build_install_and_test)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    container:
      image: ubuntu:24.04
      # TSan needs ASLR disabled on kernels with high mmap entropy (setarch -R), which Docker's default seccomp profile forbids
      options: --security-opt seccomp=unconfined
    name: "Sanitizers: ${{ matrix.sanitizers }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["address,undefined", "thread"]

    steps:
      - name: Install Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git llvm-19-dev clang-19 libomp-19-dev libboost-all-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      # builds DiscoPoP_UT with -DDP_SANITIZERS and runs it with the *SAN_OPTIONS and suppressions (test/unit_tests/sanitizers)
      - name: Build and run DiscoPoP_UT
        run: |
          scripts/dev/run_profiler_sanitizers.sh "${{ matrix.sanitizers }}"

  checks_successful:
    runs-on: self-hosted
    name: Checks successful
    needs: [build_install_and_test, sanitizers]
    # require success explicitly: a skipped job (e.g. a pull request from a fork) must not report success
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          if [[ "${{ needs.build_install_and_test.result }}" != "success" || "${{ needs.sanitizers.result }}" != "success" ]]; then
            echo "Checks did not succeed: build_install_and_test: '${{ needs.build_install_and_test.result }}', sanitizers: '${{ needs.sanitizers.result }}'"
            exit 1
          fi
          echo "All checks successful!"
