name: "DiscoPoP CI"

on:
  push:
    branches:
      - master
      - new_explorer  # This is a temporary addition and should be removed before merging into master!
  pull_request:
    branches:
      - "**"
  # manual runs, e.g. to get the callback benchmark (callback_benchmark) for a branch
  workflow_dispatch:

# the jobs only read the repository
permissions:
  contents: read

# a new push to a pull request supersedes the running checks of the previous push; the limited
# self-hosted capacity is spent on the current state. pushes to master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
# used for eventual multiple operating system testing
# the entries cover each supported LLVM version (19-22) and the minimum Python (3.10) once, see CLAUDE.md.
# LLVM 21 is packaged by neither distribution (apt.llvm.org), Python 3.10 comes from the deadsnakes PPA.
# "python" is the interpreter the venv is created with.
  create_matrix:
    runs-on: self-hosted
    name: Create matrix
    # the jobs run on a self-hosted runner: never execute code from pull requests of forks there.
    # a maintainer pushes such a branch to this repository to have it checked.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.create_matrix.outputs.matrix }}
    steps:
      - name: Create build matrix
        id: create_matrix
        shell: bash
        run: |
          matrix='{"include":[
            {"id":"ubuntu-24-04-llvm-19-python-3.10",
             "base_image":"ubuntu:24.04",
             "python":"python3.10",
             "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y software-properties-common && add-apt-repository -y ppa:deadsnakes/ppa && apt install -y python3.10 python3.10-venv python3.10-tk python3.10-dev && apt install -y llvm-19-dev clang-19 libomp-19-dev"
            },
            {"id":"ubuntu-24-04-llvm-20",
             "base_image":"ubuntu:24.04",
             "python":"python3",
             "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y llvm-20-dev clang-20 libomp-20-dev"
            },
            {"id":"debian-trixie-llvm-21",
             "base_image":"debian:trixie",
             "python":"python3",
             "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y wget lsb-release gnupg && wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && bash /tmp/llvm.sh 21 && apt install -y llvm-21-dev clang-21 libomp-21-dev"
            },
            {"id":"debian-trixie-llvm-22",
             "base_image":"debian:trixie",
             "python":"python3",
             "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y llvm-22-dev clang-22 libomp-22-dev"
            }
          ]}'

          if [[ "${{ github.event_name }}" = "pull_request" && "${{ github.base_ref }}" != "master" ]]; then
            matrix='{"include":[
              {"id":"ubuntu-24-04-llvm-19-python-3.10",
               "base_image":"ubuntu:24.04",
               "python":"python3.10",
               "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y software-properties-common && add-apt-repository -y ppa:deadsnakes/ppa && apt install -y python3.10 python3.10-venv python3.10-tk python3.10-dev && apt install -y llvm-19-dev clang-19 libomp-19-dev"
              },
              {"id":"ubuntu-24-04-llvm-20",
               "base_image":"ubuntu:24.04",
               "python":"python3",
               "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y llvm-20-dev clang-20 libomp-20-dev"
              },
              {"id":"debian-trixie-llvm-21",
               "base_image":"debian:trixie",
               "python":"python3",
               "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y wget lsb-release gnupg && wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && bash /tmp/llvm.sh 21 && apt install -y llvm-21-dev clang-21 libomp-21-dev"
              },
              {"id":"debian-trixie-llvm-22",
               "base_image":"debian:trixie",
               "python":"python3",
               "install_deps_cmd":"export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-all-dev && apt install -y llvm-22-dev clang-22 libomp-22-dev"
              }
            ]}'
          fi

          {
            echo "matrix<<END"
            echo "$matrix"
            echo "END"
          } >> "$GITHUB_OUTPUT"


  build_install_and_test:
    runs-on: self-hosted
    container:
      image: ${{ matrix.base_image }}
    name: "Build image, install package & test for: (${{ matrix.id }}) with image: (${{ matrix.base_image }})"
    needs: [create_matrix]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}

    steps:
      - name: Install Prerequisites
        run: |
          ${{ matrix.install_deps_cmd }}

      - name: Checkout Repository
        uses: actions/checkout@v4
#        with:
#          submodules: recursive

      - name: Check all files for DiscoPoP License tag
        run: |
          ./scripts/dev/check-license.sh $(find . -type f)

      - name: Setup venv and install DiscoPoP
        run: |
          rm -rf venv
          ${{ matrix.python }} -m venv venv
          venv/bin/pip install -r requirements-dev.txt -e . ./profiler ./explorer ./library ./hotspot_detection ./GUI ./mcp_server

      - name: Run MyPy Type Checking
        run: |
            venv/bin/python3 -m mypy --config-file=mypy.ini

      - name: Check formatting of DiscoPoP Explorer
        run: |
            venv/bin/python3 -m black -l 120 --check explorer

      - name: Check formatting of DiscoPoP Library
        run: |
            venv/bin/python3 -m black -l 120 --check library

      - name: Check formatting of the leak check programs and evaluation
        run: |
            venv/bin/python3 -m black -l 120 --check test/leak_check

      - name: Check formatting of DiscoPoP Hotspot Detection
        run: |
            venv/bin/python3 -m black -l 120 --check hotspot_detection/discopop_hotspot_analyzer hotspot_detection/discopop_hotspot_cc hotspot_detection/discopop_hotspot_cxx

      - name: Check formatting of DiscoPoP GUI
        run: |
            venv/bin/python3 -m black -l 120 --check GUI

      - name: Check formatting of DiscoPoP MCP Server
        run: |
            venv/bin/python3 -m black -l 120 --check mcp_server

      - name: Check formatting of the benchmark drivers and the instrumentation tests
        run: |
            venv/bin/python3 -m black -l 120 --check benchmark/pass_overhead benchmark/injected_functions test/instrumentation

      # Python: the roots and import mode are configured in pyproject.toml ([tool.pytest.ini_options])
      - name: Unit test check
        run: |
          . venv/bin/activate
          python3 -m pytest
          cmake -S . -B build_tests -DCMAKE_BUILD_TYPE=Release -DDP_BUILD_UNITTESTS=1
          cmake --build build_tests --target DiscoPoP_UT DiscoPoP_Pass_UT -j "$(nproc)"
          build_tests/test/unit_tests/DiscoPoP_UT
          build_tests/test/pass_unit_tests/DiscoPoP_Pass_UT

      # the IR the pass produces: which callbacks are inserted where (test/instrumentation)
      - name: Instrumentation tests
        run: |
            . venv/bin/activate
            python3 -m unittest -v -k "*test.instrumentation.*"

      - name: Profiler gold standard tests
        run: |
            . venv/bin/activate
            python3 -m unittest -v -k "*test.profiler.*"

      - name: Python end-to-end-tests
        run: |
            . venv/bin/activate
            python3 -m unittest -v -k "*.end_to_end.*"


  # SANITIZED UNIT TESTS of the profiler runtime library: the C++ unit tests (DiscoPoP_UT) run against a runtime
  # built with sanitizers (DP_SANITIZERS). Finds memory errors, undefined behavior and data races in the runtime's
  # code, but only in what the unit tests exercise: no LLVM pass and no instrumented program are involved.
  # The other memory check, "Leak check of instrumented programs", runs real instrumented programs instead.
  # Locally: scripts/dev/run_profiler_sanitizers.sh <address,undefined|thread>
  runtime_unit_tests_sanitized:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see build_install_and_test)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    container:
      image: ubuntu:24.04
      # TSan needs ASLR disabled on kernels with high mmap entropy (setarch -R), which Docker's default seccomp profile forbids
      options: --security-opt seccomp=unconfined
    name: "Runtime unit tests with sanitizers (${{ matrix.label }})"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizers: "address,undefined"
            label: "ASan+UBSan: memory errors, undefined behavior"
          - sanitizers: "thread"
            label: "TSan: data races"

    steps:
      - name: Install Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv python3-tk build-essential make cmake git llvm-19-dev clang-19 libomp-19-dev libboost-all-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      # builds DiscoPoP_UT with -DDP_SANITIZERS and runs it with the *SAN_OPTIONS and suppressions (test/unit_tests/sanitizers)
      - name: Build the runtime unit tests with ${{ matrix.sanitizers }} and run them
        run: |
          scripts/dev/run_profiler_sanitizers.sh "${{ matrix.sanitizers }}"

  # LEAK CHECK OF INSTRUMENTED PROGRAMS: small programs (test/leak_check/programs) are compiled with the DiscoPoP
  # pass, linked against a runtime built with AddressSanitizer/LeakSanitizer and run. The runtime library must
  # not leak, and must not keep growing memory over the run time (see scripts/dev/check_profiler_leaks.sh and
  # test/leak_check/evaluate_leaks.py). It only looks for leaks, but in the whole pipeline and in more detail than
  # LSan's check at exit: before and after the runtime's shutdown, against a list of known bounded leaks, and
  # short against long runs. The sanitized unit tests are a separate job ("Runtime unit tests with sanitizers").
  # One platform is enough: the check is about the runtime library's code, not about the platform.
  # Locally: scripts/dev/check_profiler_leaks.sh, or scripts/dev/run_ci_locally.sh -j instrumented_programs_leak_check
  instrumented_programs_leak_check:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    container:
      image: debian:trixie
    name: "Leak check of instrumented programs (ASan/LSan)"
    timeout-minutes: 45
    steps:
      - name: Install Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 build-essential make cmake git llvm-19-dev clang-19 libclang-rt-19-dev libomp-19-dev libboost-all-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build, run and evaluate the leak check programs
        run: |
          # the unit tests run under ASan/LSan in the "Runtime unit tests with sanitizers" job already
          DP_LEAK_CHECK_JOBS="$(nproc)" scripts/dev/check_profiler_leaks.sh --skip-unit-tests

  # Line coverage of the runtime library by DiscoPoP_UT (clang source based coverage, see
  # scripts/dev/run_rtlib_coverage.sh). Not part of checks_successful yet: the floor of 90% lines is
  # reported, not enforced, until it has proven stable on the runner.
  rtlib_coverage:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    container:
      image: ubuntu:24.04
    name: "Coverage: runtime library unit tests"
    timeout-minutes: 45
    steps:
      - name: Install Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 build-essential make cmake git llvm-19 llvm-19-dev clang-19 libomp-19-dev libboost-all-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Measure the coverage of the runtime library
        run: |
          scripts/dev/run_rtlib_coverage.sh --markdown-out rtlib_coverage_summary.md --min-line-coverage 90

      - name: Add the report to the job summary
        if: ${{ always() }}
        run: |
          if [ -f rtlib_coverage_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat rtlib_coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Builds a set of small programs with and without the DiscoPoP pass and runs both
  # (benchmark/pass_overhead). Fails if a program does not build or run, or if the instrumented
  # binary does not reproduce the output of the uninstrumented one; the timings are reported, not
  # enforced.
  pass_overhead_benchmark:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    container:
      image: ubuntu:24.04
    name: "Benchmark: overhead of the DiscoPoP LLVM pass"
    timeout-minutes: 60
    steps:
      - name: Install Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv build-essential make cmake git llvm-19-dev clang-19 libomp-19-dev libboost-all-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      # only the profiler is needed, installed without -e: otherwise LLVMDiscoPoP.so is not in the venv
      - name: Setup venv and install the DiscoPoP profiler
        run: |
          rm -rf venv
          python3 -m venv venv
          venv/bin/pip install -r requirements-dev.txt ./profiler

      - name: Compare builds with and without the DiscoPoP pass
        run: |
          venv/bin/python3 benchmark/pass_overhead/run_pass_benchmark.py --json-out pass_overhead_results.json --markdown-out pass_overhead_summary.md

      - name: Add the comparison to the job summary
        if: ${{ always() }}
        run: |
          if [ -f pass_overhead_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat pass_overhead_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # What the injected callbacks cost (benchmark/injected_functions): per call, with and without their
  # bodies, and per program, attributed to the single callbacks (--callback-breakdown, builds the
  # runtime library variants). The times depend on the runner too much to gate on, and the breakdown
  # is expensive: only on pushes to master/new_explorer and manual runs, not part of checks_successful.
  callback_benchmark:
    runs-on: self-hosted
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    container:
      image: ubuntu:24.04
    name: "Benchmark: cost of the injected callbacks"
    timeout-minutes: 120
    steps:
      - name: Install Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive && apt update && apt install -y python3 python3-pip python3-venv build-essential make cmake git llvm-19 llvm-19-dev clang-19 libomp-19-dev libboost-all-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      # installed without -e: the breakdown drives clang with the pass plugin from the venv
      - name: Setup venv and install the DiscoPoP profiler
        run: |
          rm -rf venv
          python3 -m venv venv
          venv/bin/pip install -r requirements-dev.txt ./profiler

      # configures and builds build_tests itself
      - name: Measure the injected callbacks with and without their bodies
        run: |
          venv/bin/python3 benchmark/injected_functions/run_callback_benchmark.py --json-out callback_benchmark_results.json --markdown-out callback_benchmark_summary.md

      - name: Add the comparison to the job summary
        if: ${{ always() }}
        run: |
          if [ -f callback_benchmark_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat callback_benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the runtime library variants
        run: |
          cmake --build build_tests --target DiscoPoP_RT_BenchmarkVariants -j "$(nproc)"

      # one repetition per configuration: the question is which callbacks dominate, not by how many percent
      - name: Attribute the whole program overhead to the callbacks
        run: |
          venv/bin/python3 benchmark/pass_overhead/run_pass_benchmark.py --callback-breakdown --repetitions 1 --json-out callback_breakdown_results.json --markdown-out callback_breakdown_summary.md

      - name: Add the breakdown to the job summary
        if: ${{ always() }}
        run: |
          if [ -f callback_breakdown_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat callback_breakdown_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  checks_successful:
    runs-on: self-hosted
    name: Checks successful
    needs: [build_install_and_test, runtime_unit_tests_sanitized, instrumented_programs_leak_check, pass_overhead_benchmark]
    # require success explicitly: a skipped job (e.g. a pull request from a fork) must not report success
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" != "false" ]]; then
            echo "Checks did not succeed, job results: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "All checks successful!"
