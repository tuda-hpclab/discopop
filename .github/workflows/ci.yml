name: "DiscoPoP CI"

# which configurations run is decided in create_matrix: the full matrix when merging into master
# (pushes to it, pull requests targeting it), debian trixie with LLVM 21 for every other pull request.
# A commit is tested once: branches are tested through their pull request (which also covers the pull requests of a
# stack, whose target is another feature branch), so a push only runs for the branches that code is merged into.
# A branch without a pull request is tested by a manual run (workflow_dispatch).
on:
  push:
    branches:
      - master
  pull_request:
  # manual runs, e.g. to get the benchmarks (job benchmarks) for a branch
  workflow_dispatch:
    inputs:
      callback_breakdown:
        description: "Add the callback breakdown to the callback benchmark (takes long)"
        type: boolean
        default: false

# the jobs only read the repository
permissions:
  contents: read

# a new push to a pull request or a branch supersedes the running checks of the previous push; the limited
# self-hosted capacity is spent on the current state. pushes to master and new_explorer are never cancelled.
# (a pull request is identified by its number, so the duplicate runs that a rebase of a stack can start for it cancel
# each other as well)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/new_explorer') }}

# upper bound of the parallel test processes (pytest-xdist workers and the profiling threads of test/profiler): `-n auto`
# starts one worker per core, which ran a 48 thread / 64 GB host out of memory (every worker builds and profiles
# programs and runs the explorer), and two runners share that host. Raise it only together with the RAM of the runner.
env:
  DP_TEST_WORKERS: 4

jobs:
# used for eventual multiple operating system testing
# the full matrix runs when merging into master; other pushes only test debian trixie with LLVM 21
# ("reduced"): every other pull request (e.g. those of a stack) and manual run. The jobs outside the matrix run in
# both cases.
# the entries cover each supported LLVM version (19-22) and the minimum Python (3.11) once, see CLAUDE.md.
# LLVM 21 is packaged by neither distribution (apt.llvm.org), Python 3.11 comes from the deadsnakes PPA.
# "python" is the interpreter the venv is created with.
#
# PREREQUISITE IMAGES: installing the prerequisites (apt) in every job took longer than some of the jobs. Instead,
# prepare_images builds one image per environment (base image + install_deps_cmd), once, and pushes it to the
# GitHub container registry; the other jobs run in these images and only check out the repository. The tag of an image
# is derived from its base image and install command, so changing either one builds a new image, and a push that
# changes neither one reuses the existing image. Bump IMAGE_REVISION to rebuild all images, e.g. to update the packages.
  create_matrix:
    # a GitHub-hosted runner: it only decides what runs, and starts at once instead of waiting for a self-hosted slot
    runs-on: ubuntu-latest
    name: Create matrix
    # the jobs run on a self-hosted runner: never execute code from pull requests of forks there.
    # a maintainer pushes such a branch to this repository to have it checked.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 5
    permissions:
      contents: read
      # looks up which prerequisite images exist already
      packages: read
      # look up whether a pull request run tested the tree of a push already
      actions: read
      pull-requests: read
    outputs:
      tested_by: ${{ steps.tested.outputs.tested_by }}
      scope: ${{ steps.create_matrix.outputs.scope }}
      benchmarks: ${{ steps.create_matrix.outputs.benchmarks }}
      matrix: ${{ steps.create_matrix.outputs.matrix }}
      missing_images: ${{ steps.missing_images.outputs.missing_images }}
      tools_image: ${{ steps.create_matrix.outputs.tools_image }}
      primary_image: ${{ steps.create_matrix.outputs.primary_image }}
      head_label: ${{ steps.versions.outputs.head_label }}
      base_sha: ${{ steps.versions.outputs.base_sha }}
      base_label: ${{ steps.versions.outputs.base_label }}
      base_note: ${{ steps.versions.outputs.base_note }}
    steps:
      - name: Create build matrix
        id: create_matrix
        shell: bash
        env:
          # the direct target of a pull request: for a stacked pull request, GITHUB_BASE_REF names the bottom of the
          # stack instead (e.g. new_explorer for a pull request into another feature branch of the stack)
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          IMAGE_REVISION=1
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/discopop-ci"

          # entry <id> <base image> <python> <install command>: one environment, as a JSON object
          entry() {
            local tag
            tag="$1-$(printf '%s\n%s\n%s\n' "$IMAGE_REVISION" "$2" "$4" | sha256sum | cut -c1-12)"
            printf '{"id":"%s","base_image":"%s","python":"%s","install_deps_cmd":"%s","image":"%s"}' \
              "$1" "$2" "$3" "$4" "$repository:$tag"
          }
          image_of() { sed -E 's/.*"image":"([^"]*)".*/\1/' <<< "$1"; }

          # --no-install-recommends and libboost-dev (DiscoPoP only uses header-only Boost libraries) keep the images small:
          # libboost-all-dev pulls in OpenMPI and, through it, the AMD HIP runtime and a second LLVM
          apt_install="apt install -y --no-install-recommends"
          # the libraries PySide6 loads for the widget tests of the Qt GUI on the offscreen platform (no X server needed)
          apt_qt="libgl1 libegl1 libxkbcommon0 libglib2.0-0t64 libfreetype6 libfontconfig1 libdbus-1-3"
          apt_common="export DEBIAN_FRONTEND=noninteractive && apt update && $apt_install ca-certificates python3 python3-pip python3-venv python3-tk build-essential make cmake git libboost-dev $apt_qt"
          # apt.llvm.org without its llvm.sh, which also installs lldb, lld, clangd and further tools; apt reads the
          # ASCII-armored key itself, so gnupg is not needed
          apt_llvm_org="$apt_install wget && wget -qO /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key && echo 'deb http://apt.llvm.org/trixie/ llvm-toolchain-trixie-21 main' > /etc/apt/sources.list.d/apt.llvm.org.list && apt purge -y --auto-remove wget && apt update"

          # clang-tools provides clang-scan-deps: CMake 3.28 scans the C++20 sources of a Ninja build with it, and without it
          # the C++ OpenMP probe of the profiler build fails ("Could NOT find OpenMP_CXX", CMAKE_CXX_COMPILER_CLANG_SCAN_DEPS-NOTFOUND)
          e_llvm19="$(entry ubuntu-24-04-llvm-19-python-3.11 ubuntu:24.04 python3.11 "$apt_common && $apt_install software-properties-common && add-apt-repository -y ppa:deadsnakes/ppa && $apt_install python3.11 python3.11-venv python3.11-tk python3.11-dev && $apt_install llvm-19-dev clang-19 clang-tools-19 libclang-19-dev libomp-19-dev")"
          e_llvm20="$(entry ubuntu-24-04-llvm-20 ubuntu:24.04 python3 "$apt_common && $apt_install llvm-20-dev clang-20 clang-tools-20 libclang-20-dev libomp-20-dev")"
          e_llvm21="$(entry debian-trixie-llvm-21 debian:trixie python3 "$apt_common && $apt_llvm_org && $apt_install llvm-21-dev clang-21 clang-tools-21 libclang-21-dev libomp-21-dev")"
          e_llvm22="$(entry debian-trixie-llvm-22 debian:trixie python3 "$apt_common && $apt_install llvm-22-dev clang-22 clang-tools-22 libclang-22-dev libomp-22-dev")"
          # the runtime checks (sanitized unit tests, leak check, coverage; no venv needed); llvm-19 provides llvm-cov,
          # llvm-profdata and llvm-symbolizer, libclang-rt-19-dev the sanitizer and profile runtimes (only recommended by
          # clang-19)
          e_tools="$(entry ubuntu-24-04-llvm-19-tools ubuntu:24.04 python3 "$apt_common && $apt_install llvm-19 llvm-19-dev clang-19 libclang-rt-19-dev libomp-19-dev")"

          # the full matrix only where code is merged into master (pushes and pull requests targeting it);
          # every other push is checked on one platform to keep development runs short
          if [[ ( "$GITHUB_EVENT_NAME" = "push" && "$GITHUB_REF" = "refs/heads/master" ) \
             || ( "$GITHUB_EVENT_NAME" = "pull_request" && "$PR_BASE_REF" = "master" ) ]]; then
            matrix="{\"include\":[$e_llvm19,$e_llvm20,$e_llvm21,$e_llvm22]}"
            images="[$e_llvm19,$e_llvm20,$e_llvm21,$e_llvm22,$e_tools]"
            scope="full"
          else
            matrix="{\"include\":[$e_llvm21]}"
            images="[$e_llvm21,$e_tools]"
            scope="reduced"
          fi
          # the benchmarks (about half of the time of a run) compare against the version before and are of interest where
          # code is merged, not for every pull request of a stack: those get them through a manual run of the branch
          if [[ "$scope" = "full" || "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]; then
            benchmarks="true"
          else
            benchmarks="false"
          fi
          echo "Configuration: $scope (event: $GITHUB_EVENT_NAME, ref: $GITHUB_REF, pull request target: ${PR_BASE_REF:-none}, GITHUB_BASE_REF: ${GITHUB_BASE_REF:-none})"

          {
            echo "scope=$scope"
            echo "benchmarks=$benchmarks"
            echo "matrix<<END"
            echo "$matrix"
            echo "END"
            echo "images<<END"
            echo "$images"
            echo "END"
            echo "tools_image=$(image_of "$e_tools")"
            # the environment of the jobs outside the matrix that need the venv (static checks, benchmarks): the matrix entry
            # both configurations contain, so its venv is prepared anyway
            echo "primary_image=$(image_of "$e_llvm21")"
          } >> "$GITHUB_OUTPUT"

          # A push to master whose tree a pull request run has tested completely already (the merge of a pull request that
      # was up to date with master, which the branch protection of master requires) is not tested again: its checks
      # are skipped and checks_successful names the run that tested it. A pull request run tests the merge of its head
      # into the target branch as it was then; that tree equals the tree of the head if the head contains the target
      # branch of then, which is an ancestor of the master before the push (the first parent). So the tree was tested if
      # it equals the tree of the head of a merged pull request into master that contains that first parent, and if that
      # head has a successful run with the full matrix (a pull request retargeted to master without a new push only had
      # a reduced run).
      - name: Find out whether a pull request run tested this tree already
        id: tested
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.act }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ steps.create_matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          api() { gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/$1" "${@:2}"; }
          tree="$(api "commits/$GITHUB_SHA" -q .commit.tree.sha)"
          first_parent="$(api "commits/$GITHUB_SHA" -q '.parents[0].sha')"
          environments="$(jq '.include | length' <<< "$MATRIX")"
          tested_by=""
          while read -r number head; do
            [ -n "$number" ] || continue
            if [ "$(api "commits/$head" -q .commit.tree.sha)" != "$tree" ]; then
              echo "#$number: the tree of its head ${head:0:8} differs"; continue
            fi
            if [[ ! "$(api "compare/$first_parent...$head" -q .status)" =~ ^(ahead|identical)$ ]]; then
              echo "#$number: its head ${head:0:8} does not contain ${first_parent:0:8}"; continue
            fi
            while read -r run_id run_url; do
              [ -n "$run_id" ] || continue
              # every matrix entry of the full configuration had to run its tests, and the run had to succeed
              python_tests="$(api "actions/runs/$run_id/jobs?per_page=100" --paginate \
                -q '[.jobs[] | select((.name | startswith("Python tests:")) and .conclusion == "success")] | length' \
                | awk '{ sum += $1 } END { print sum + 0 }')"
              if [ "$python_tests" -ge "$environments" ]; then
                tested_by="$run_url"; break
              fi
              echo "#$number: run $run_url tested $python_tests of $environments environments"
            done < <(api "actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=20" \
                       -q '.workflow_runs[] | "\(.id) \(.html_url)"')
            [ -z "$tested_by" ] || break
          done < <(api "commits/$GITHUB_SHA/pulls" \
                     -q '.[] | select(.base.ref == "master" and .merged_at != null) | "\(.number) \(.head.sha)"')
          if [ -n "$tested_by" ]; then
            echo "The tree of $GITHUB_SHA was tested by $tested_by: its checks are skipped"
          else
            echo "No pull request run tested the tree of $GITHUB_SHA: it is tested"
          fi
          echo "tested_by=$tested_by" >> "$GITHUB_OUTPUT"

      # only the images that do not exist yet are built (prepare_images): usually none, and then that job is skipped
      # instead of taking a runner per image to find out
      - name: Find the prerequisite images that do not exist yet
        id: missing_images
        shell: bash
        env:
          IMAGES: ${{ steps.create_matrix.outputs.images }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # local runs with act (scripts/dev/run_ci_locally.sh): no registry, the images are in the local docker store
          if [ -z "${ACT:-}" ]; then
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin > /dev/null
          fi
          missing="$(jq -c '.[]' <<< "$IMAGES" | while read -r environment; do
            image="$(jq -r .image <<< "$environment")"
            if [ -z "${ACT:-}" ]; then
              exists() { docker manifest inspect "$1" > /dev/null 2>&1; }
            else
              exists() { docker image inspect "$1" > /dev/null 2>&1; }
            fi
            if exists "$image"; then
              echo "$image exists" >&2
            else
              echo "$image has to be built" >&2
              echo "$environment"
            fi
          done | jq -sc .)"
          echo "missing_images=$missing" >> "$GITHUB_OUTPUT"

      # the versions the benchmarks compare (job benchmarks): a pull request against the tip of its target branch,
      # a push against the state before it; a manual run and the first push of a branch have nothing to compare with
      - name: Determine the versions to compare
        id: versions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            head_label="PR #$PR_NUMBER (${HEAD_SHA:0:8})"
          else
            head_label="$GITHUB_REF_NAME (${HEAD_SHA:0:8})"
          fi
          base_sha="" base_label="" base_note=""
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            base_sha="$BASE_SHA"
            if [ -n "$PR_NUMBER" ]; then
              base_label="$PR_BASE_REF (${BASE_SHA:0:8})"
            else
              base_label="before the push (${BASE_SHA:0:8})"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base_note="a manual run has no version to compare with"
          else
            base_note="the first push of a branch has no version to compare with"
          fi
          {
            echo "head_label=$head_label"
            echo "base_sha=$base_sha"
            echo "base_label=$base_label"
            echo "base_note=$base_note"
          } >> "$GITHUB_OUTPUT"

  # builds the prerequisite images that do not exist in the registry yet (see create_matrix), on a GitHub-hosted runner:
  # it needs no self-hosted resources. Skipped when all images exist, so the jobs that need it accept a skipped one.
  prepare_images:
    runs-on: ubuntu-latest
    name: "Prepare image: ${{ matrix.id }}"
    needs: [create_matrix]
    if: ${{ needs.create_matrix.outputs.missing_images != '[]' }}
    timeout-minutes: 60
    # the only job that writes to the registry; the others only read
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.create_matrix.outputs.missing_images) }}
    steps:
      - name: Build and push the image, unless it exists
        shell: bash
        env:
          ID: ${{ matrix.id }}
          IMAGE: ${{ matrix.image }}
          BASE_IMAGE: ${{ matrix.base_image }}
          INSTALL_CMD: ${{ matrix.install_deps_cmd }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # local runs with act (scripts/dev/run_ci_locally.sh): no registry, the image stays in the local docker
          if [ -z "${ACT:-}" ]; then
            echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "$IMAGE exists"
              exit 0
            fi
          elif docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE exists"
            exit 0
          fi
          docker build --pull --network=host -t "$IMAGE" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "INSTALL_CMD=$INSTALL_CMD" - <<'EOF'
          ARG BASE_IMAGE=ubuntu:24.04
          FROM ${BASE_IMAGE}
          ARG INSTALL_CMD
          RUN bash -c "$INSTALL_CMD" && rm -rf /var/lib/apt/lists/*
          EOF
          if [ -z "${ACT:-}" ]; then
            docker push "$IMAGE"

            # the image of this environment was rebuilt (its install command or base image changed): delete the
            # superseded ones. The pattern is strict, a prefix would also match other environments (ids share prefixes).
            # Best effort: a failing cleanup must not fail the build; expire_ci_images.yml removes them later anyway.
            (
              set -euo pipefail
              owner="${GITHUB_REPOSITORY_OWNER,,}"
              api="https://api.github.com"
              auth=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
              if curl -fsS "${auth[@]}" "$api/orgs/$owner" > /dev/null 2>&1; then scope="orgs"; else scope="users"; fi
              versions="$api/$scope/$owner/packages/container/discopop-ci/versions"
              current="${IMAGE##*:}"
              for page in 1 2 3 4 5; do
                curl -fsS "${auth[@]}" "$versions?per_page=100&page=$page" \
                  | jq -r --arg id "$ID" --arg current "$current" \
                    '.[] | select(any(.metadata.container.tags[]; test("^" + $id + "-[0-9a-f]{12}$")) and (.metadata.container.tags | index($current) | not)) | .id'
              done | while read -r version; do
                echo "deleting superseded version $version of $ID"
                curl -fsS -X DELETE "${auth[@]}" "$versions/$version" > /dev/null
              done
            ) || echo "::warning::could not delete the superseded images of $ID"
          fi


  # The tests of the matrix entries are split into the jobs below (the Python based checks in one, the profiler build in
  # another), which run in parallel.
  #
  # STATIC CHECKS: independent of the platform (black targets the supported Python versions, see pyproject.toml), so
  # they run once instead of per matrix entry. They need neither the prepared image nor DiscoPoP, only black and ruff:
  # a GitHub-hosted runner, which starts at once, so that they are the first result of a run. Executing the code of a
  # pull request of a fork is harmless there, but its other jobs do not run anyway (create_matrix).
  static_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "Static checks: license tags, formatting (black), lint (ruff), package versions"
    # only for skipping a tested push (create_matrix takes seconds on a hosted runner)
    needs: [create_matrix]
    if: ${{ needs.create_matrix.outputs.tested_by == '' }}
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check all files for the DiscoPoP license tag
        run: |
          ./scripts/dev/check-license.sh $(find . -type f)

      # the versions CI pins in requirements-dev.txt; the other requirements are not needed
      - name: Setup venv with black and ruff
        run: |
          python3 -m venv venv
          venv/bin/pip install $(grep -E '^(black|ruff)==' requirements-dev.txt)

      - name: Check formatting of DiscoPoP Explorer
        run: |
          venv/bin/python3 -m black -l 120 --check explorer

      - name: Check formatting of DiscoPoP Library
        run: |
          venv/bin/python3 -m black -l 120 --check library

      - name: Check formatting of the leak check programs and evaluation
        run: |
          venv/bin/python3 -m black -l 120 --check test/leak_check

      - name: Check formatting of DiscoPoP Hotspot Detection
        run: |
          venv/bin/python3 -m black -l 120 --check hotspot_detection/discopop_hotspot_analyzer hotspot_detection/discopop_hotspot_cc hotspot_detection/discopop_hotspot_cxx

      - name: Check formatting of DiscoPoP GUI
        run: |
          venv/bin/python3 -m black -l 120 --check GUI

      - name: Check formatting of DiscoPoP MCP Server
        run: |
          venv/bin/python3 -m black -l 120 --check mcp_server

      - name: Check formatting of the benchmark drivers and the instrumentation tests
        run: |
          venv/bin/python3 -m black -l 120 --check benchmark/pass_overhead benchmark/injected_functions benchmark/compare test/instrumentation

      # the whole repository, which is clean also outside the paths black checks; the rules are configured in pyproject.toml
      - name: Lint the Python code (ruff)
        run: |
          venv/bin/python3 -m ruff check

      # a VERSION change is a release (release.yml): the requirements between the packages must fit the versions
      - name: Check the versions and the requirements between the packages (scripts/dev/release.py check)
        run: |
          venv/bin/pip install --quiet packaging
          venv/bin/python3 scripts/dev/release.py check

  # PROFILER UNIT TESTS: the GoogleTest binaries of the runtime library (DiscoPoP_UT) and the LLVM pass (DiscoPoP_Pass_UT);
  # built from the root CMakeLists.txt, they need no venv
  profiler_unit_tests:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Profiler unit tests: runtime library and LLVM pass (${{ matrix.id }})"
    needs: [create_matrix, prepare_images]
    # prepare_images is skipped when all images exist
    if: ${{ !cancelled() && needs.create_matrix.result == 'success' && (needs.prepare_images.result == 'success' || needs.prepare_images.result == 'skipped') && needs.create_matrix.outputs.tested_by == '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build the unit tests
        run: |
          cmake -S . -B build_tests -DCMAKE_BUILD_TYPE=Release -DDP_BUILD_UNITTESTS=1
          cmake --build build_tests --target DiscoPoP_UT DiscoPoP_Pass_UT -j "$(nproc)"

      - name: Run the runtime library unit tests (DiscoPoP_UT)
        run: |
          build_tests/test/unit_tests/DiscoPoP_UT

      - name: Run the LLVM pass unit tests (DiscoPoP_Pass_UT)
        run: |
          build_tests/test/pass_unit_tests/DiscoPoP_Pass_UT

      # a header that only compiles because its includer included something first breaks as soon as the includes change:
      # this compiles every header of the profiler on its own, with the flags of the build above
      - name: Compile every header on its own (scripts/dev/check_headers.py)
        run: |
          python3 scripts/dev/check_headers.py build_tests

      # most of the runtime is configured by -DDP_... options, and the default build compiles only one variant:
      # this builds the runtime library once per set of options, so that an option does not stop compiling unnoticed.
      # The runtime library does not depend on LLVM: one environment (the primary one, part of every run) suffices.
      - name: Build the runtime library with the compile time options (scripts/dev/check_rtlib_options.sh)
        if: ${{ matrix.image == needs.create_matrix.outputs.primary_image }}
        run: |
          scripts/dev/check_rtlib_options.sh

  # PYTHON TESTS per matrix entry: type check (mypy checks against the Python version of the interpreter it runs with),
  # the unit tests (the roots and import mode are configured in pyproject.toml, [tool.pytest.ini_options]), the profiler
  # tests of programs compiled with discopop_cxx (which callbacks the pass inserts where: test/instrumentation, and the
  # data dependencies the profiling run finds: test/profiler) and the end-to-end tests (the whole pipeline: profiling,
  # pattern detection, patches, MCP server, on small programs).
  # One job instead of one per kind: each kind takes about a minute, so a job of its own spent more time on starting the
  # container, restoring the venv and waiting for a free runner than on the checks. The steps all run, so a run
  # reports every failing kind; the profiler build (profiler_unit_tests) stays a job of its own, it takes minutes.
  # BUILT CODE: the job also provides the venv with all DiscoPoP packages (installed without -e) of its environment: it
  # restores it from the actions cache, or builds and saves it there (see .github/actions/prepared-venv), so that the
  # benchmarks restore it. The built profiler is cached separately and keyed by profiler/ only: a change of the Python
  # sources reinstalls the packages, but does not rebuild the profiler. (A job of its own preparing the venv cost another
  # wait for a runner between the image and the tests, up to an hour in busy times.)
  python_tests:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Python tests: mypy, unit, profiler, end-to-end (${{ matrix.id }})"
    needs: [create_matrix, prepare_images]
    # prepare_images is skipped when all images exist
    if: ${{ !cancelled() && needs.create_matrix.result == 'success' && (needs.prepare_images.result == 'success' || needs.prepare_images.result == 'skipped') && needs.create_matrix.outputs.tested_by == '' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup venv with DiscoPoP (built and saved to the cache, unless it is cached)
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ matrix.image }}
          python: ${{ matrix.python }}
          save: "true"

      - name: Type check (mypy)
        run: |
          venv/bin/python3 -m mypy --config-file=mypy.ini

      # the end-to-end and profiler tests are part of the bare pytest run, but have their own steps
      - name: Python unit tests
        if: ${{ !cancelled() }}
        run: |
          . venv/bin/activate
          python3 -m pytest -n "$DP_TEST_WORKERS" -m "not e2e and not profiler"

      - name: Instrumentation tests
        if: ${{ !cancelled() }}
        run: |
          . venv/bin/activate
          python3 -m pytest -v -n "$DP_TEST_WORKERS" --dist loadgroup test/instrumentation

      - name: Profiler gold standard tests
        if: ${{ !cancelled() }}
        run: |
          . venv/bin/activate
          python3 -m pytest -v -n "$DP_TEST_WORKERS" --dist loadgroup test/profiler

      - name: Python end-to-end tests
        if: ${{ !cancelled() }}
        run: |
          . venv/bin/activate
          python3 -m pytest -v -n "$DP_TEST_WORKERS" --dist loadgroup --durations=20 test/end_to_end

  # CACHES OF A TESTED PUSH: a push to master whose checks are skipped (see create_matrix, tested_by) still saves the
  # venv and the profiler wheel of every environment to the actions cache: the caches of master are the ones every
  # pull request into it can restore (a pull request cannot read the caches of another one), so without them the first
  # run of every pull request would build the profiler again. Restoring an existing cache takes seconds.
  warm_caches:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    name: "Caches of a tested push (${{ matrix.id }})"
    needs: [create_matrix, prepare_images]
    if: ${{ !cancelled() && needs.create_matrix.result == 'success' && (needs.prepare_images.result == 'success' || needs.prepare_images.result == 'skipped') && needs.create_matrix.outputs.tested_by != '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create_matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build the venv with DiscoPoP and save it to the cache, unless it is cached
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ matrix.image }}
          python: ${{ matrix.python }}
          save: "true"

  # RUNTIME CHECKS of the profiler runtime library, independent of the platform (one environment, the tools image), in one
  # job: each check takes only one or two minutes, so jobs of their own spent about as much time on starting containers
  # and waiting for runners. They run next to the tests instead of after them: off the critical path of a run.
  # Every step runs, so a run reports every failing check.
  # - SANITIZED UNIT TESTS: the C++ unit tests (DiscoPoP_UT) against a runtime built with sanitizers (DP_SANITIZERS).
  #   Finds memory errors, undefined behavior and data races in the runtime's code, but only in what the unit tests
  #   exercise: no LLVM pass and no instrumented program are involved.
  #   Locally: scripts/dev/run_profiler_sanitizers.sh <address,undefined|thread>
  # - LEAK CHECK OF INSTRUMENTED PROGRAMS: small programs (test/leak_check/programs) are compiled with the DiscoPoP
  #   pass, linked against a runtime built with AddressSanitizer/LeakSanitizer and run. The runtime library must
  #   not leak, and must not keep growing memory over the run time (see scripts/dev/check_profiler_leaks.sh and
  #   test/leak_check/evaluate_leaks.py). It only looks for leaks, but in the whole pipeline and in more detail than
  #   LSan's check at exit: before and after the runtime's shutdown, against a list of known bounded leaks, and
  #   short against long runs. Locally: scripts/dev/check_profiler_leaks.sh
  # - COVERAGE: line coverage of the runtime library by DiscoPoP_UT (clang source based coverage, see
  #   scripts/dev/run_rtlib_coverage.sh). Not enforced yet (continue-on-error): the floor of 90% lines is reported
  #   until it has proven stable on the runner.
  # Locally: scripts/dev/run_ci_locally.sh -j runtime_checks
  runtime_checks:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner: create_matrix is skipped for them;
    # prepare_images is skipped when all images exist
    if: ${{ !cancelled() && needs.create_matrix.result == 'success' && (needs.prepare_images.result == 'success' || needs.prepare_images.result == 'skipped') && needs.create_matrix.outputs.tested_by == '' }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.create_matrix.outputs.tools_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
      # TSan needs ASLR disabled on kernels with high mmap entropy (setarch -R), which Docker's default seccomp profile forbids
      options: --security-opt seccomp=unconfined
    name: "Runtime checks: sanitizers, leak check, coverage"
    needs: [create_matrix, prepare_images]
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # build DiscoPoP_UT with -DDP_SANITIZERS and run it with the *SAN_OPTIONS and suppressions (test/unit_tests/sanitizers)
      - name: "Runtime unit tests with ASan+UBSan: memory errors, undefined behavior"
        if: ${{ !cancelled() }}
        run: |
          scripts/dev/run_profiler_sanitizers.sh address,undefined

      - name: "Runtime unit tests with TSan: data races"
        if: ${{ !cancelled() }}
        run: |
          scripts/dev/run_profiler_sanitizers.sh thread

      - name: "Leak check of instrumented programs (ASan/LSan)"
        if: ${{ !cancelled() }}
        run: |
          # the unit tests run under ASan/LSan in the step above already
          DP_LEAK_CHECK_JOBS="$(nproc)" scripts/dev/check_profiler_leaks.sh --skip-unit-tests

      - name: Coverage of the runtime library by its unit tests (not enforced)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          scripts/dev/run_rtlib_coverage.sh --markdown-out rtlib_coverage_summary.md --min-line-coverage 90

      - name: Add the coverage report to the job summary
        if: ${{ always() }}
        run: |
          if [ -f rtlib_coverage_summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat rtlib_coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # BENCHMARKS: both compare the version under test with the one before it (see create_matrix, "versions") on the
  # same runner, interleaved round by round, so that a change of the runner's speed affects both alike. They run last,
  # after all checks and tests, and one after the other in one job, so that no other job of the run competes for the
  # machine while they measure (and the run waits for a runner once instead of once per benchmark).
  # The last steps turn their results into the pull request comment, the job summary and the artifact
  # "benchmark-report" (HTML with charts). Regressions are flagged there, but never fail the CI.
  # Locally: benchmark/compare/run_ab_benchmarks.py and benchmark/compare/compare_benchmarks.py
  #
  # - pass overhead: builds a set of small programs with and without the DiscoPoP pass and runs both
  #   (benchmark/pass_overhead). Fails the job if a program of the version under test does not build or run, or if its
  #   instrumented binary does not reproduce the output of the uninstrumented one; the timings are reported, not
  #   enforced.
  # - injected callbacks: what the injected callbacks cost (benchmark/injected_functions): per call, with and without
  #   their bodies. On request (pull request label "benchmark-breakdown", or the input of a manual run) also per
  #   program, attributed to the single callbacks (--callback-breakdown, builds the runtime library variants), which
  #   takes long. The times depend on the runner too much to gate on: it never fails the job (continue-on-error).
  benchmarks:
    runs-on: self-hosted
    # never run code from pull requests of forks on the self-hosted runner (see create_matrix)
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.create_matrix.outputs.benchmarks == 'true' && needs.static_checks.result == 'success' && needs.profiler_unit_tests.result == 'success' && needs.python_tests.result == 'success' && needs.runtime_checks.result == 'success' }}
    permissions:
      contents: read
      packages: read
      # reads the labels of the pull request and writes the comment with the report
      pull-requests: write
    container:
      image: ${{ needs.create_matrix.outputs.primary_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN || 'unset' }}
    # benchmark_breakdown.yml re-runs this job by its name
    name: "Benchmarks: pass overhead, injected callbacks, comparison report"
    needs: [create_matrix, static_checks, profiler_unit_tests, python_tests, runtime_checks]
    timeout-minutes: 240
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # the venv python_tests saved; the profiler has to be installed without -e: otherwise LLVMDiscoPoP.so is not in
      # the venv, and the breakdown drives clang with the pass plugin from the venv
      - name: Setup venv with DiscoPoP
        uses: ./.github/actions/prepared-venv
        with:
          environment: ${{ needs.create_matrix.outputs.primary_image }}

      # the labels are read when the job runs, not taken from the event: adding the label to a pull request re-runs
      # this job of its latest run (benchmark_breakdown.yml), whose event still has the labels it started with
      - name: Check whether the callback breakdown is requested
        id: breakdown
        if: ${{ !env.ACT }}
        uses: actions/github-script@v7
        with:
          script: |
            let requested = false;
            if (context.eventName === 'workflow_dispatch') {
              requested = String(context.payload.inputs?.callback_breakdown) === 'true';
            } else if (context.eventName === 'pull_request') {
              const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
              requested = data.labels.some((label) => label.name === 'benchmark-breakdown');
            }
            core.info(`callback breakdown requested: ${requested}`);
            core.setOutput('requested', String(requested));

      # failing to prepare it only removes it from the comparison; the report says so
      - name: Prepare the version to compare with
        if: ${{ needs.create_matrix.outputs.base_sha != '' }}
        continue-on-error: true
        uses: ./.github/actions/base-version
        with:
          sha: ${{ needs.create_matrix.outputs.base_sha }}
          environment: ${{ needs.create_matrix.outputs.primary_image }}

      - name: "Pass overhead: compare builds with and without the DiscoPoP pass, both versions interleaved"
        id: pass_overhead
        shell: bash
        env:
          HEAD_LABEL: ${{ needs.create_matrix.outputs.head_label }}
          BASE_LABEL: ${{ needs.create_matrix.outputs.base_label }}
          BASE_NOTE: ${{ needs.create_matrix.outputs.base_note }}
          BASE_SHA: ${{ needs.create_matrix.outputs.base_sha }}
        run: |
          base_options=()
          if [ -n "$BASE_SHA" ]; then
            base_options=(--base-python venv_base/bin/python)
          fi
          venv/bin/python3 benchmark/compare/run_ab_benchmarks.py --results-dir benchmark_results \
            --head-label "$HEAD_LABEL" --base-label "$BASE_LABEL" --base-note "$BASE_NOTE" "${base_options[@]}" \
            pass-overhead --rounds 2 --repetitions 3

      # configures and builds both versions of the benchmark itself (build_tests, build_base); only after a successful
      # pass overhead benchmark, as before
      - name: "Injected callbacks: measure them with and without their bodies, both versions interleaved"
        if: ${{ !cancelled() && steps.pass_overhead.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HEAD_LABEL: ${{ needs.create_matrix.outputs.head_label }}
          BASE_LABEL: ${{ needs.create_matrix.outputs.base_label }}
          BASE_NOTE: ${{ needs.create_matrix.outputs.base_note }}
          BASE_SHA: ${{ needs.create_matrix.outputs.base_sha }}
          BREAKDOWN: ${{ steps.breakdown.outputs.requested }}
        run: |
          base_options=()
          if [ -n "$BASE_SHA" ]; then
            base_options=(--base-python venv_base/bin/python)
          fi
          callback_options=(--rounds 3 --repetitions 5)
          if [ -d base ]; then
            callback_options+=(--base-source-dir base)
          fi
          if [ "$BREAKDOWN" != "true" ]; then
            callback_options+=(--no-breakdown)
          fi
          venv/bin/python3 benchmark/compare/run_ab_benchmarks.py --results-dir benchmark_results \
            --head-label "$HEAD_LABEL" --base-label "$BASE_LABEL" --base-note "$BASE_NOTE" "${base_options[@]}" \
            callbacks "${callback_options[@]}"

      - name: Upload the results
        if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/
          if-no-files-found: ignore
          overwrite: true

      # the report (not in local runs with act: scripts/dev/run_ci_locally.sh sets github.event.act, and there is no
      # artifact service there); the comparison only needs the standard library.
      # The report is informative: its steps never fail the job, which checks_successful requires (e.g. a transient
      # error of the GitHub API when commenting; it was a job of its own outside checks_successful before)
      - name: Compare the versions
        id: compare
        if: ${{ !cancelled() && !github.event.act && steps.pass_overhead.outcome != 'skipped' }}
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 benchmark/compare/compare_benchmarks.py --results-dir benchmark_results --run-url "$RUN_URL" \
            --html-out benchmark_report/benchmark_report.html --json-out benchmark_report/benchmark_comparison.json \
            --markdown-out benchmark_report/benchmark_report.md > /dev/null

      - name: Upload the report
        id: upload
        if: ${{ !cancelled() && steps.compare.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark_report/
          overwrite: true

      # once more, now that the link to the uploaded report is known
      - name: Link the report and add it to the job summary
        id: link
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python3 benchmark/compare/compare_benchmarks.py --results-dir benchmark_results --run-url "$RUN_URL" \
            --report-url "$REPORT_URL" --markdown-out benchmark_comment.md > /dev/null
          cat benchmark_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.link.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          # the API answers with a server error now and then (HTTP 500)
          retries: 3
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('benchmark_comment.md', 'utf8');
            const marker = '<!-- discopop-benchmark-report -->';
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

  checks_successful:
    # only evaluates the results of the other jobs: a GitHub-hosted runner, no self-hosted slot
    runs-on: ubuntu-latest
    name: Checks successful
    # a matrix job stands for all of its entries, i.e. the configurations create_matrix selected for
    # this run: debian trixie with LLVM 21 in the reduced, every entry in the full configuration
    needs: [create_matrix, static_checks, python_tests, profiler_unit_tests, runtime_checks, benchmarks]
    # require success explicitly: a skipped job (e.g. a pull request from a fork) must not report success
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          TESTED_BY: ${{ needs.create_matrix.outputs.tested_by }}
        run: |
          # a push to master whose tree a pull request run tested completely already (see create_matrix): its checks
          # are skipped on purpose
          if [ "${{ needs.create_matrix.result }}" = "success" ] && [ -n "$TESTED_BY" ]; then
            echo "This tree was tested by $TESTED_BY; its checks were skipped"
            exit 0
          fi
          # the benchmark is skipped where create_matrix did not ask for it (a pull request of a stack); every other
          # skipped job (e.g. all of them for a pull request from a fork) must not report success
          benchmark_skipped_as_planned="${{ needs.create_matrix.outputs.benchmarks == 'false' && needs.benchmarks.result == 'skipped' }}"
          others_skipped="${{ needs.create_matrix.result == 'skipped' || needs.static_checks.result == 'skipped' || needs.python_tests.result == 'skipped' || needs.profiler_unit_tests.result == 'skipped' || needs.runtime_checks.result == 'skipped' || (needs.benchmarks.result == 'skipped' && needs.create_matrix.outputs.benchmarks != 'false') }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" != "false" || "$others_skipped" != "false" ]]; then
            echo "Checks did not succeed, job results: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          if [ "$benchmark_skipped_as_planned" = "true" ]; then
            echo "The benchmarks are not part of this run (pull request into a feature branch); run the workflow manually for them"
          fi
          echo "All checks successful (${{ needs.create_matrix.outputs.scope }} configuration: ${{ join(fromJson(needs.create_matrix.outputs.matrix || '{"include":[]}').include.*.id, ', ') }})"
