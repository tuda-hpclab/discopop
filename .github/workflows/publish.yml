name: Publish DiscoPoP Package

on:
  push:
    tags:
      - "v*[0-9]*.[0-9]*.[0-9]*"
      - "!v*[0-9]*.[0-9]*.[0-9]*a[0-9]*"
      - "!v*[0-9]*.[0-9]*.[0-9]*b[0-9]*"
      - "!v*[0-9]*.[0-9]*.[0-9]*dev[0-9]*"

# the draft GitHub release (disabled for now, see below) needs "contents: write" in addition
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish DiscoPoP Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch master branch (shallow)
        run: git fetch origin master --depth=1
        shell: bash

      - name: Ensure tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag ${GITHUB_REF_NAME} is not on master. Skipping release."
            exit 1
          fi
        shell: bash

      # the root package is metadata only (it depends on the other packages), built like the pre-release
      - name: Build discopop
        run: pip install build && python -m build .

      # disabled for now: a draft GitHub release per stable release
      # - name: Extract Version
      #   id: get_version
      #   run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      #
      # - name: Create Release
      #   id: create_release
      #   uses: actions/create-release@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     tag_name: ${{ github.ref_name }}
      #     release_name: Version ${{ steps.get_version.outputs.VERSION }}
      #     draft: true
      #     prerelease: false

      # trusted publishing, as the other publish workflows: the project discopop on PyPI has to list this workflow
      # (publish.yml) as a trusted publisher
      - name: Publish Distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
