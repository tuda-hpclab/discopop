# Known limitation of the library analysis: ostream::operator<<(int) and __ostream_insert are compiled
# into libstdc++.so (extern templates of basic_ostream<char>), so the writes to the stream's buffer are not seen.
# Each iteration appends to out, which must keep the loop on line 10 from being a do-all.
xfail = "stream output of numbers happens in libstdc++.so, which is not instrumented: the loop is reported as do-all"

[do_all]
excludes = ["1:10"]
