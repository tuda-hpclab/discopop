run_args = "16"
xfail = "delta is initialized before the loop: the classification of the do-all detector does not see that every path through the if/else chain writes delta before reading it (firstread, not firstwritten), and without an INIT dependency inside the loop the static RAW dependencies 1:20..1:32 -> 1:34 reject the loops 13, 17 and 18"

# do_all/simple/conditional_scalar/written_on_all_paths with delta initialized before the loop: the
# initial value is never read inside the loop, so the same loops are do-all loops with delta private.
[do_all]
lines = ["1:13", "1:17", "1:18", "1:39", "1:40", "1:51"]
