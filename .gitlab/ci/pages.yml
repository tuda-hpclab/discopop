# Translated from .github/workflows/update_wiki.yml.
#
# GitHub built docs/ with the jekyll-build-pages action and deployed via the
# GitHub Pages actions. GitLab Pages instead publishes whatever a job named
# `pages` leaves in the `public/` artifact, so build and deploy collapse into
# one job. The branch condition (`update_wiki`) is kept as it was.
#
# NOTE: docs/_config.yml uses `remote_theme: just-the-docs/just-the-docs`, which
# is a GitHub Pages feature provided by the jekyll-remote-theme plugin. docs/Gemfile
# pins just-the-docs as a normal gem, so if this job fails on the theme, switch
# `remote_theme:` to `theme:` in docs/_config.yml.
pages:
  stage: deploy
  image: ruby:3.2
  rules:
    - if: $CI_COMMIT_BRANCH == "update_wiki"
  script:
    - cd docs
    - bundle install
    - bundle exec jekyll build --destination ../public
  artifacts:
    paths:
      - public
